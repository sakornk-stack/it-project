# nginx site for EduAnalyzeAI — a NEW, separate file. Does not touch the
# existing "equipment" site or its certificate.
#
# Install (root on the VPS; full steps in docs/DEPLOY.md):
#   cp ~/eduanalyze/deploy/nginx.conf /etc/nginx/sites-available/eduanalyze
#   ln -s /etc/nginx/sites-available/eduanalyze /etc/nginx/sites-enabled/zz-eduanalyze
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d eduanalyze.itkukps.tech --redirect
#
# The link is named zz-eduanalyze so it sorts after "equipment": with no
# default_server anywhere, nginx uses the first server it loads for requests
# by bare IP or unknown Host, and that stays the equipment site.
#
# Starts as HTTP only. certbot then issues a separate certificate for this
# name only, adds the 443 server (it adds `listen [::]:443 ssl` without
# ipv6only=on, which the equipment site already sets) and the 80 -> 443
# redirect.
#
# Upstreams are the compose ports from ~/eduanalyze/.env, bound to 127.0.0.1:
#   FRONTEND_PORT=3400 (Next.js), BACKEND_PORT=3401 (NestJS, every route under /api).

server {
    listen 80;
    listen [::]:80;
    server_name eduanalyze.itkukps.tech;

    server_tokens off;

    # The API takes JSON only (no file uploads); Express caps bodies at 100 kB.
    client_max_body_size 2m;

    # Security headers for every response (nginx sends them on errors too
    # with `always`). Browsers ignore HSTS over plain HTTP, so it takes effect
    # once certbot has added HTTPS. No add_header inside the locations below,
    # or these would stop being inherited.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # nginx is the only proxy in front of the app (TRUST_PROXY_HOPS=1), so the
    # client address is $remote_addr. X-Forwarded-For is overwritten, not
    # appended, so a client cannot inject addresses of its own.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass http://127.0.0.1:3401;
        # helmet already sets these on API responses; drop the upstream copies
        # so each header is sent once, with the values above.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_hide_header X-Powered-By;
    }
}
