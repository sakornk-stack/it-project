# DATA LOSS WARNING — the postgres_data volume holds the only copy of the dev
# data. On 2026-10-06 `docker-compose down -v` deleted it and every table came
# back empty; it was only recoverable because an earlier pg_dump existed.
#   - Stop with `npm run docker:stop` (docker compose stop). Never `down -v`,
#     `docker volume rm/prune` or `docker system prune`.
#   - Never stop or touch another project's containers/volumes (e.g.
#     pm25-pipeline) even if a port looks taken; find what holds the port first.
#   - Run `npm run db:backup -- <label>` before any QA/test round that touches
#     Docker. Reset test data with a seed or the API, not by deleting volumes.
#
# Daily dev only needs the postgres service:
#   docker compose up -d postgres
# backend/frontend keep running natively (npm run start:dev / npm run dev)
# against it on host port 5433.
#
# The full stack (all 3 services, backend+frontend built as images) is for
# testing an actual containerized deploy, not the everyday dev loop:
#   npm run docker:rebuild            (both images)
#   npm run docker:rebuild:frontend   (frontend only)
#   npm run docker:rebuild:backend    (backend only)
#
# backend/frontend have NO volume mount and run a production build
# (`next build`/`nest build` baked into the image at build time) — editing
# source and then running plain `docker compose up -d` silently reuses the
# stale image with NO error or warning. Always pass --build (the npm
# scripts above do this for you) after changing backend/frontend source.
# Run `npm run docker:check-fresh` if unsure whether a running image is
# already stale.
#
# Postgres is published on host port 5433, never 5432 — a pre-existing
# Homebrew Postgres install may already be using 5432, and this project's
# real data was migrated out of it via pg_dump/pg_restore, not by
# stopping/replacing that install. Keeping 5433 permanent (not just during
# migration) means falling back to Homebrew Postgres is always just
# pointing DATABASE_URL at 5432 again, no container changes needed.
services:
  postgres:
    image: postgres:16
    env_file:
      - apps/backend/.env
    environment:
      POSTGRES_DB: eduanalyze_ai
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d eduanalyze_ai']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - apps/backend/.env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    # GET /api/health (public, DB ping). Mirrors the HEALTHCHECK in
    # apps/backend/Dockerfile; start_period covers `prisma migrate deploy`.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Must be a browser-reachable URL (see apps/frontend/Dockerfile
        # comment) — the backend's host-published port, not the
        # Docker-internal "backend" hostname. Must include the /api
        # prefix (NestJS's global prefix, see main.ts) — every backend
        # route lives under /api, so omitting it 404s on every call.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        # Inlined at build time like API_URL; set in the shell (or a root
        # .env) to override. Defaults match apps/frontend/.env.example.
        NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES: ${NEXT_PUBLIC_IDLE_TIMEOUT_MINUTES:-30}
        NEXT_PUBLIC_IDLE_WARNING_SECONDS: ${NEXT_PUBLIC_IDLE_WARNING_SECONDS:-60}
        NEXT_PUBLIC_SESSION_MAX_HOURS: ${NEXT_PUBLIC_SESSION_MAX_HOURS:-8}
        NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN: ${NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN:-false}
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  # Never run `docker compose down -v` without meaning to delete all
  # database data — this volume is the only thing making it persistent
  # across container restarts.
  postgres_data:
