name: Keep Render awake

# Render's free plan sleeps a service after 15 idle minutes; a request every
# 10 minutes keeps the single EduAnalyze service (render.yaml) awake. One
# service awake all month is ~744 instance-hours, inside the 750 free hours.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w '%{http_code} in %{time_total}s\n' https://eduanalyze-sakorn-web.onrender.com/api/health
