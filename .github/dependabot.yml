# Keeps the SHA-pinned actions (with their "# vX.Y.Z" comments) and the
# Dockerfile base images up to date through weekly pull requests. Review each
# PR like any other change: it runs CI before anything can deploy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # A new Node major is a deliberate upgrade (engines, Prisma, Next.js
      # support, CI node-version), never an automatic PR. Minor/patch of the
      # current major still arrive.
      - dependency-name: node
        update-types: ['version-update:semver-major']
