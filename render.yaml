# Render Blueprint: ONE web service on the free plan running both the API and
# the web app (deploy/render/Dockerfile), with the database on Neon.
# Render → New → Blueprint → pick this repo. Steps and caveats: docs/DEPLOY-RENDER.md
#
# Why one service: Render's free plan sleeps a service after 15 idle minutes.
# With the API and the web as two services, the web woke first and its /api
# calls hit a still-sleeping API (502). One service has one instance-hours
# meter (~744 h/month < 750 free), so .github/workflows/keepalive.yml can keep
# it awake all month.
services:
  - type: web
    name: eduanalyze-sakorn-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (postgresql://…?sslmode=require); filled in on
      # the dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_2FA_PENDING_SECRET
        generateValue: true
      # 64 hex characters; must be the SAME value the old API service had, or
      # existing 2FA secrets cannot be decrypted. Filled in on the dashboard.
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      # Bare hosts get https:// in deploy/render/start.sh.
      - key: FRONTEND_URL
        value: eduanalyze-sakorn-web.onrender.com
      - key: CORS_ORIGIN
        value: eduanalyze-sakorn-web.onrender.com
      # Browser → Render edge → Next (rewrite) → API on 127.0.0.1.
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://eduanalyze-sakorn-web.onrender.com/api/auth/google/callback
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Render's free plan blocks SMTP ports; mail goes out through Brevo's
      # HTTPS API instead (SMTP_FROM = the Brevo-verified sender).
      - key: BREVO_API_KEY
        sync: false
      # Build arg: shows the Google button on the sign-in page.
      - key: NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN
        value: "true"
