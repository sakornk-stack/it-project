# Render Blueprint: database + API + web on the free plan.
# Render → New → Blueprint → pick this repo. Steps and caveats: docs/DEPLOY-RENDER.md
#
# The two web services reach each other by their public onrender.com host.
# Render keeps the service name as the host when it is free; if it adds a
# suffix (shown on the service page), update the three *_HOST-style values
# below to match and redeploy.
databases:
  - name: eduanalyze-db
    plan: free
    region: singapore
    databaseName: eduanalyze_ai
    user: eduanalyze
    postgresMajorVersion: "16"

services:
  - type: web
    name: eduanalyze-sakorn-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eduanalyze-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_2FA_PENDING_SECRET
        generateValue: true
      # 64 hex characters; filled in on the dashboard (never committed).
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      # Bare hosts get https:// in docker-entrypoint.sh.
      - key: FRONTEND_URL
        value: eduanalyze-sakorn-web.onrender.com
      - key: CORS_ORIGIN
        value: eduanalyze-sakorn-web.onrender.com
      # Browser → Render edge → web (Next proxy) → Render edge → API.
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Google sign-in is off on this deployment (the web build leaves
      # NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN=false), but the API's Google strategy
      # still needs non-empty values to boot.
      - key: GOOGLE_CLIENT_ID
        value: google-login-disabled
      - key: GOOGLE_CLIENT_SECRET
        value: google-login-disabled
      - key: GOOGLE_CALLBACK_URL
        value: https://eduanalyze-sakorn-web.onrender.com/api/auth/google/callback
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: eduanalyze-sakorn-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      # Build args: the browser calls /api on this site, which forwards it to the API.
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_TARGET
        value: eduanalyze-sakorn-api.onrender.com
